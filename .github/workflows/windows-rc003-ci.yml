name: windows-rc003-ci

# Candidate CI for the Open Voice Bridge · RC003 Windows client
# (apps/windows/rc003). This runs the cross-platform pure-Python test suite
# and a public-boundary scan on a real Windows runner, builds an unsigned
# PyInstaller artifact, smoke-checks the built executable with --dry-run
# (imports every module, touches no GUI/BLE/HID/audio, exits 0), compiles
# the Inno Setup installer SOURCE into an unsigned installer .exe, and
# packages a deterministic unsigned portable ZIP (a versioned staging
# folder containing the built app plus LICENSE.txt/COPYRIGHT.txt/
# THIRD_PARTY_NOTICES.md/ATTRIBUTION.md/README.txt - the same provenance
# and instructional content the installer itself carries) + installer +
# SHA256SUMS.txt artifact set.
#
# Honest disclosure of what this CI run DOES touch: the Windows-only tests
# under tests/windows/ (self-skipping everywhere else) exercise a real,
# harmless, runner-local Win32 SendInput call and a real hidden Raw Input
# listener's start/stop/restart lifecycle - both entirely local to the
# runner process, with no observable OS-wide effect asserted beyond the
# call/listener itself succeeding. What this job never does, anywhere: pair
# with, connect to, or control any real RC003 hardware; open any GUI window;
# perform BLE discovery/pairing; route real audio; install/enable any audio
# driver; or RUN the compiled installer .exe - runner-based CI has no RC003
# device attached anyway, so real-device behavior remains a manual
# verification step (see this subtree's README.md "Known gaps" section).
#
# All gates below are required (XRBM-018: the Inno Setup compile step was
# promoted from best-effort/continue-on-error to a required gate, matching
# every other step) - a failure at any step fails the whole job.
#
# Exit-code gating (XRBM-014 review RETRY P2 #3): pwsh steps below check
# $LASTEXITCODE explicitly after every native command, since a non-zero
# native exit code does not automatically fail a GitHub Actions step unless
# it is the last command in the script block.

# XRBM-022 controller pre-review correction: the installer (.iss) and the
# PyInstaller spec both consume these repository-root files directly
# (COPYRIGHT/LICENSE/THIRD_PARTY_NOTICES.md are packaged into the installed
# app; device-profiles/xiaomi-rc003.json documents the identity/HID facts
# the Windows adapter's own device_profile.py mirrors), so a change to any
# of them must re-run this workflow even though none of them live under
# apps/windows/rc003/.
on:
  push:
    paths:
      - "apps/windows/rc003/**"
      - ".github/workflows/windows-rc003-ci.yml"
      - "COPYRIGHT"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "device-profiles/xiaomi-rc003.json"
  pull_request:
    paths:
      - "apps/windows/rc003/**"
      - ".github/workflows/windows-rc003-ci.yml"
      - "COPYRIGHT"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "device-profiles/xiaomi-rc003.json"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows/rc003
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/windows/rc003/requirements-dev.txt

      - name: Public boundary scan
        shell: pwsh
        run: |
          ./build/check-public-boundary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile check
        shell: pwsh
        run: |
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run test suite
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -t . -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PyInstaller build (unsigned candidate)
        shell: pwsh
        run: |
          python -m PyInstaller build/OpenVoiceBridgeRC003.spec --distpath dist --workpath build/pyinstaller-work --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Built-artifact dry-run smoke check (no GUI/BLE/HID/audio)
        shell: pwsh
        run: |
          $builtExe = "dist/OpenVoiceBridgeRC003/OpenVoiceBridgeRC003.exe"
          if (-not (Test-Path $builtExe)) {
            Write-Error "expected built executable not found: $builtExe"
            exit 1
          }
          & $builtExe --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # XRBM-018: promoted from best-effort to a required gate - this
      # SOURCE-compiles the Inno Setup script into an installer .exe
      # artifact and must pass like every other gate above. It still never
      # runs or installs anything: ISCC.exe only compiles, and the
      # resulting installer .exe is uploaded as unsigned CI evidence, never
      # executed here or anywhere else in this task.
      - name: Compile Inno Setup installer (required gate, never run/installed)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after installing Inno Setup"
            exit 1
          }
          & $iscc installer\OpenVoiceBridgeRC003Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package deterministic unsigned portable ZIP + SHA256SUMS
        shell: pwsh
        run: |
          # "Deterministic" here means deterministic, non-random/non-timestamped
          # OUTPUT FILENAMES (derived from the .iss AppVersion, not a build
          # number or GUID) plus a checksum manifest generated in sorted
          # order - not bit-for-bit reproducible-build byte equality, which
          # PyInstaller does not guarantee upstream. Never signed, never
          # published, never installed here.
          $issText = Get-Content -Raw installer\OpenVoiceBridgeRC003Setup.iss
          $versionMatch = [regex]::Match($issText, '#define AppVersion "([^"]+)"')
          if (-not $versionMatch.Success) {
            Write-Error "could not determine AppVersion from installer\OpenVoiceBridgeRC003Setup.iss"
            exit 1
          }
          $version = $versionMatch.Groups[1].Value

          # XRBM-022 controller pre-review correction: the installer
          # packages LICENSE/COPYRIGHT/THIRD_PARTY_NOTICES.md and ships an
          # instructional readme, but the portable ZIP previously
          # compressed only dist/OpenVoiceBridgeRC003/* (the bare
          # PyInstaller one-dir output) - so a user who only downloaded the
          # portable ZIP, never the installer, got no license, copyright,
          # third-party attribution/provenance, or usage instructions at
          # all. Fixed by staging a versioned COPY of the built app plus
          # those same files before compressing, so both distribution forms
          # carry the same provenance/legal/instructional content. Staging
          # into "dist/portable/$stagingName" (rather than compressing
          # dist/OpenVoiceBridgeRC003/ in place) also means Compress-Archive
          # is given the staging FOLDER itself (not a "/*" content glob), so
          # the resulting ZIP has exactly one top-level versioned folder to
          # extract into - never loose files scattered at the archive root.
          $stagingName = "OpenVoiceBridgeRC003-$version"
          $stagingDir = "dist/portable/$stagingName"
          if (Test-Path $stagingDir) { Remove-Item $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Copy-Item -Path "dist/OpenVoiceBridgeRC003/*" -Destination $stagingDir -Recurse -Force

          Copy-Item -Path "../../../LICENSE" -Destination (Join-Path $stagingDir "LICENSE.txt") -Force
          Copy-Item -Path "../../../COPYRIGHT" -Destination (Join-Path $stagingDir "COPYRIGHT.txt") -Force
          Copy-Item -Path "../../../THIRD_PARTY_NOTICES.md" -Destination (Join-Path $stagingDir "THIRD_PARTY_NOTICES.md") -Force
          Copy-Item -Path "ATTRIBUTION.md" -Destination (Join-Path $stagingDir "ATTRIBUTION.md") -Force
          Copy-Item -Path "installer/readme-rc003.txt" -Destination (Join-Path $stagingDir "README.txt") -Force

          $zipPath = "dist/portable/OpenVoiceBridgeRC003-$version-portable-unsigned.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path $stagingDir -DestinationPath $zipPath -CompressionLevel Optimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installerExe = Get-ChildItem -Path dist/installer -Filter "OpenVoiceBridgeRC003Setup-*-unsigned.exe" | Select-Object -First 1
          if (-not $installerExe) {
            Write-Error "expected compiled installer .exe not found under dist/installer"
            exit 1
          }

          $hashed = @(
            (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath),
            (Get-FileHash -Algorithm SHA256 -LiteralPath $installerExe.FullName)
          )
          $lines = $hashed |
            Sort-Object { Split-Path $_.Path -Leaf } |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii

      # XRBM-022 controller pre-review correction: this is the ONLY
      # upload-artifact step in this job, and it runs LAST, after every
      # required gate above (test suite, PyInstaller build, dry-run smoke
      # check, and - critically - the Inno Setup compile) has already
      # succeeded. An earlier round uploaded the raw PyInstaller output
      # right after the dry-run smoke check, i.e. BEFORE the Inno compile
      # gate ran - so a job whose Inno step then failed could still leave a
      # published artifact behind. No artifact may be published before
      # every required gate has passed.
      - name: Upload deterministic distribution artifacts (unsigned, never installed/signed/published)
        uses: actions/upload-artifact@v7
        with:
          name: OpenVoiceBridgeRC003-distribution-unsigned
          path: |
            apps/windows/rc003/dist/portable/*.zip
            apps/windows/rc003/dist/installer/*.exe
            apps/windows/rc003/dist/SHA256SUMS.txt
          if-no-files-found: error
