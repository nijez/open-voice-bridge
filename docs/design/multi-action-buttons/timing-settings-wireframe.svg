<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1d1d1f; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1d1d1f; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1d1d1f; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #6e6e73; }
      .input { font: 650 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1d1d1f; }
      .button { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #1d1d1f; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1100" height="580" fill="#f5f5f7"/>
  <text x="70" y="65" class="title">与“动作映射”同级：手势判定</text>
  <text x="70" y="98" class="small">独立于实体按键列表，直接输入毫秒数，合法值自动保存。</text>

  <rect x="70" y="135" width="960" height="365" rx="22" fill="#ffffff" filter="url(#shadow)"/>

  <text x="105" y="184" class="heading">手势判定</text>
  <text x="105" y="213" class="small">统一应用到全部已配置多动作的按键</text>
  <rect x="850" y="163" width="145" height="42" rx="10" fill="#f2f2f4"/>
  <text x="922" y="190" text-anchor="middle" class="button">恢复默认</text>
  <line x1="105" y1="238" x2="995" y2="238" stroke="#e5e5ea"/>

  <text x="105" y="282" class="heading">双击间隔</text>
  <text x="105" y="311" class="small">第二次按下距离第一次按下的最长时间</text>
  <rect x="820" y="265" width="120" height="46" rx="9" fill="#ffffff" stroke="#b8b8bd" stroke-width="1.5"/>
  <text x="880" y="294" text-anchor="middle" class="input">350</text>
  <text x="954" y="294" class="body">ms</text>

  <line x1="105" y1="343" x2="995" y2="343" stroke="#eeeeef"/>

  <text x="105" y="387" class="heading">长按时长</text>
  <text x="105" y="416" class="small">持续按住多久后执行长按动作</text>
  <rect x="820" y="370" width="120" height="46" rx="9" fill="#ffffff" stroke="#b8b8bd" stroke-width="1.5"/>
  <text x="880" y="399" text-anchor="middle" class="input">500</text>
  <text x="954" y="399" class="body">ms</text>

  <rect x="105" y="444" width="890" height="36" rx="10" fill="#e8f3ff"/>
  <circle cx="128" cy="462" r="7" fill="#0a84ff"/>
  <text x="149" y="468" class="small">输入无效时才提示允许范围，并继续使用上一个合法值。</text>

  <text x="70" y="548" class="small">本期只提供全局设置；单个按键的展开卡片只负责配置动作。</text>
</svg>
